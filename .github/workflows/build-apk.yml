name: Build AquaMonitor APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          test -d "$ANDROID_HOME"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        shell: bash
        run: |
          unzip -q AquaMonitorNative_AndroidStudio_Project.zip -d .
          test -f AquaMonitorNative/settings.gradle
          test -f AquaMonitorNative/app/build.gradle
          test -f AquaMonitorNative/app/src/main/AndroidManifest.xml

      - name: Build APK
        shell: bash
        run: |
          cd AquaMonitorNative
          gradle --no-daemon assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="AquaMonitorNative/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          file "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AquaMonitor-debug-APK
          path: AquaMonitorNative/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
